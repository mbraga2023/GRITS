<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GRITS — Publicações</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Inter:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div id="header"></div>


    <main class="main-content">

        <div class="content-inner">

            <div class="publications-header">
                <h1>Publicações</h1>
            </div>


            <!-- =========================================
                 FILTERS
                 ========================================= -->

            <section class="publications-filters" aria-label="Filtros de publicações">

                <div class="filter-group">

                    <label for="year-filter">
                        Ano
                    </label>

                    <select id="year-filter">
                        <option value="all">Todos</option>
                    </select>

                </div>


                <div class="filter-group">

                    <label for="author-filter">
                        Autor
                    </label>

                    <select id="author-filter">
                        <option value="all">Todos</option>
                    </select>

                </div>

            </section>


            <!-- =========================================
                 PUBLICATIONS
                 ========================================= -->

            <section id="publications-list" class="publications-list" aria-label="Lista de publicações">

                <!-- Cards generated by JavaScript -->

            </section>


            <!-- =========================================
                 EMPTY RESULT
                 ========================================= -->

            <p id="no-publications" class="no-publications" hidden>
                Nenhuma publicação encontrada.
            </p>

        </div>

    </main>


    <div id="footer"></div>


    <script src="../js/main.js"></script>

</body>

</html>
